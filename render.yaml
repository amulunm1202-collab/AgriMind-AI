services:
  - type: web
    name: agrimind-ai
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPEN_METEO_API_KEY
        sync: false
    disk:
      name: agrimind-data
      mountPath: /var/data
      sizeGB: 1
