<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login | AgriMind AI</title>

<style>

* {
    box-sizing: border-box;

    margin: 0;

    padding: 0;

    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #eef8f0,
            #f8fcf9
        );
}

.card {
    width: 420px;

    background: white;

    padding: 40px;

    border-radius: 22px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.10);
}

.logo {
    text-align: center;

    font-size: 40px;

    margin-bottom: 8px;
}

.brand {
    text-align: center;

    color: #176b3a;

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 8px;
}

.subtitle {
    text-align: center;

    color: #777;

    font-size: 14px;

    margin-bottom: 28px;
}

label {
    display: block;

    color: #444;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 7px;
}

input {
    width: 100%;

    padding: 13px;

    border: 1px solid #d5dfd8;

    border-radius: 9px;

    outline: none;

    margin-bottom: 17px;
}

input:focus {
    border-color: #176b3a;
}

.password-row {
    position: relative;
}

.password-row input {
    padding-right: 55px;
}

.show-password {
    position: absolute;

    right: 12px;

    top: 11px;

    border: none;

    background: transparent;

    color: #176b3a;

    cursor: pointer;

    font-size: 18px;
}

.forgot {
    text-align: right;

    margin-top: -7px;

    margin-bottom: 20px;
}

.forgot a {
    color: #176b3a;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;
}

.login-button {
    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 9px;

    background: #176b3a;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

.login-button:hover {
    background: #12572f;
}

.message {
    padding: 10px;

    border-radius: 8px;

    margin-bottom: 15px;

    text-align: center;

    font-size: 13px;
}

.error {
    background: #ffecec;

    color: #a33;
}

.success {
    background: #eaf8ee;

    color: #176b3a;
}

.create {
    text-align: center;

    margin-top: 23px;

    color: #666;

    font-size: 14px;
}

.create a {
    color: #176b3a;

    font-weight: bold;

    text-decoration: none;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        🌱
    </div>

    <div class="brand">
        AgriMind AI
    </div>

    <p class="subtitle">
        Smart farming powered by artificial intelligence.
    </p>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% for category, message in messages %}

            <div class="message {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="/login">


        <label>
            Email Address
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required>


        <label>
            Password
        </label>

        <div class="password-row">

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required>

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()">

                👁

            </button>

        </div>


        <div class="forgot">

            <a href="/forgot-password">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="login-button">

            Login →

        </button>

    </form>


    <div class="create">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById(
            "password"
        );

    if (
        password.type === "password"
    ) {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>

</html>
